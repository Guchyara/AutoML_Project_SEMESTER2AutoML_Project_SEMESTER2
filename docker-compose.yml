
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "local-dev-secret-key"
      TITANIC_DATA_SOURCE: ${TITANIC_DATA_SOURCE:-kaggle}
      TITANIC_LOCAL_DATA_PATH: ${TITANIC_LOCAL_DATA_PATH:-/opt/airflow/data/raw/train_and_test2.csv}
      TITANIC_LOCAL_TRAIN_ROWS: ${TITANIC_LOCAL_TRAIN_ROWS:-891}
      KAGGLE_DATASET: ${KAGGLE_DATASET:-heptapod/titanic}
      KAGGLE_COMPETITION: ${KAGGLE_COMPETITION:-titanic}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_EXPERIMENT_NAME: ${MODEL_EXPERIMENT_NAME:-titanic_model_comparison}
      REGISTERED_MODEL_NAME: ${REGISTERED_MODEL_NAME:-titanic-survival-predictor}
      DYNAMIC_DATA_SOURCE: ${DYNAMIC_DATA_SOURCE:-auto}
      DYNAMIC_ALLOW_BUILTIN_FALLBACK: ${DYNAMIC_ALLOW_BUILTIN_FALLBACK:-true}
      DYNAMIC_EXPERIMENT_PREFIX: ${DYNAMIC_EXPERIMENT_PREFIX:-dynamic_ml_pipeline}
      DYNAMIC_REGISTERED_MODEL_PREFIX: ${DYNAMIC_REGISTERED_MODEL_PREFIX:-dynamic}
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config:ro
      - ./kaggle:/home/airflow/.kaggle:ro
      - ./data:/opt/airflow/data
    command: >
      bash -c "airflow db init &&
      (airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true)"
    restart: "no"

  airflow-webserver:
    build: .
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    build: .
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment: *airflow-env
    volumes: *airflow-volumes
    restart: unless-stopped

  mlflow:
    image: python:3.10-slim
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow==2.8.1 &&
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  inference-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      INFERENCE_MODEL_NAME: ${INFERENCE_MODEL_NAME:-titanic-survival-predictor}
      INFERENCE_MODEL_STAGE: ${INFERENCE_MODEL_STAGE:-Production}
      INFERENCE_EXPERIMENT_NAME: ${INFERENCE_EXPERIMENT_NAME:-mlops_inference}
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      inference-api:
        condition: service_healthy
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
